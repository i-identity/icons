# เมื่อ merge เข้า main:
#   - ถ้ามีไฟล์ .changeset/*.md → เปิด/อัปเดต PR "Version Packages" (bump เวอร์ชัน + CHANGELOG)
#   - เมื่อ merge PR "Version Packages" → publish package ขึ้น GitHub Packages
name: Release
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
      - run: npm ci
      - uses: changesets/action@v1
        with:
          publish: npm run release
          title: "Release icons"
          commit: "chore: release icons"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
